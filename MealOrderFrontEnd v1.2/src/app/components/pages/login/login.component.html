<div class="container mt-5 d-flex justify-content-center align-items-center min-vh-90">
    <div class="card p-4 shadow-lg" style="width: 28rem; border-radius: 1rem;">
      <h2 class="text-center mb-4">Login</h2>
  
      <form (ngSubmit)="onLogin()" #adminLoginForm="ngForm" novalidate>
        <!-- Email Field -->
        <div class="mb-3">
          <label for="email" class="form-label">Email:</label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            #emailInput="ngModel"
            class="form-control"
            placeholder="Enter your email"
          />
          <div *ngIf="emailInput.invalid && emailInput.touched" class="text-danger mt-1">
            <small>Email is required</small>
          </div>
        </div>
  
        <!-- Password Field -->
        <div class="mb-3">
          <label for="password" class="form-label">Password:</label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            minlength="6"
            #passwordInput="ngModel"
            class="form-control"
            placeholder="Enter your password"
          />
          <div *ngIf="passwordInput.invalid && passwordInput.touched" class="text-danger mt-1">
            <small>Password must be at least 6 characters long</small>
          </div>
        </div>
  
        <!-- Login Button -->
        <button type="submit" [disabled]="adminLoginForm.invalid" class="btn btn-primary w-100">
          Login
        </button>
  
        <!-- Divider -->
        <div class="text-center my-3">
          <span class="text-muted">Don't have an account?</span>
        </div>
  
        <!-- Sign Up Button -->
        <button type="button" class="btn btn-outline-secondary w-100" routerLink="/signup">
          Sign Up
        </button>
      </form>
    </div>
  </div>
