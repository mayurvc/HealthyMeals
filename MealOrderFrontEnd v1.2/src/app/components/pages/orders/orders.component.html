<div class="container mt-5">
    <h2 class="text-center">My Orders</h2>
    <p class="text-center">List of all your orders</p>

    <!-- Search Input for Filtering Orders -->
    <div class="text-end mb-3">
        <input type="text" [(ngModel)]="searchTerm" (input)="updateOrders()" placeholder="Search orders..." class="form-control" style="width: 300px; display: inline-block;">
        <button class="btn btn-primary ms-2" (click)="toggleSortOrder()">
            Sort by Date ({{ sortOrder === 'asc' ? 'Descending' : 'Ascending' }})
        </button>
    </div>

    <div *ngIf="filteredOrders && filteredOrders.length > 0; else noOrders">
        <table class="table table-striped table-bordered mt-4">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Order ID</th>
                    <th>Meals</th>
                    <th>Status</th>
                    <th>Total Price</th>
                    <th>Order Date</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let order of filteredOrders; let i = index">
                    <td>{{ i + 1 }}</td>
                    <td>{{ order.id }}</td>
                    <td>{{ order.meals }}</td>
                    <td>{{ order.status }}</td>
                    <td>{{ order.totalPrice | currency }}</td>
                    <td>{{ order.createdAt | date: 'short' }}</td>
                </tr>
            </tbody>
        </table>
    </div>

    <ng-template #noOrders>
        <div class="alert alert-warning text-center mt-4">
            No orders found.
        </div>
    </ng-template>
</div>
