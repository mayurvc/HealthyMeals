<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-5 shadow-lg" style="width: 28rem; border-radius: 1rem;">
      <h2 class="text-center mb-4">Create Your Account</h2>
  
      <form (ngSubmit)="onSignup()" #signupForm="ngForm" novalidate>
        <!-- Email Field -->
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            #emailInput="ngModel"
            class="form-control"
            placeholder="Enter your email"
            autocomplete="email"
          />
          <div *ngIf="emailInput.invalid && emailInput.touched" class="text-danger mt-1">
            <small>Email is required</small>
          </div>
        </div>
  
        <!-- Password Field -->
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            minlength="6"
            #passwordInput="ngModel"
            class="form-control"
            placeholder="Enter your password"
            autocomplete="new-password"
          />
          <div *ngIf="passwordInput.invalid && passwordInput.touched" class="text-danger mt-1">
            <small>Password must be at least 6 characters long</small>
          </div>
        </div>
        <div class="mb-3" *ngIf="isAdmin">
          <label for="role" class="form-label">Role:</label>
          <select id="role" [(ngModel)]="role" name="role" class="form-select">
            <option value="user">User</option>
            <option value="provider">Provider</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <!-- Sign Up Button -->
        <button type="submit" [disabled]="signupForm.invalid" class="btn btn-primary w-100">
          Sign Up
        </button>
  
        <!-- Redirect to Login -->
        <div class="text-center my-3">
          <span class="text-muted">Already have an account?</span>
        </div>
  
        <button type="button" class="btn btn-outline-secondary w-100" routerLink="/login">
          Login
        </button>
      </form>
    </div>
  </div>
