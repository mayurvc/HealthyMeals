<div class="container mt-5">
    <h2 class="text-center">All Reviews</h2>
  
    <div *ngIf="reviews && reviews.length > 0; else noReviews">
      <table class="table table-striped table-bordered mt-4">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>User ID</th>
            <th>Meal ID</th>
            <th>Rating</th>
            <th>Comments</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let review of reviews; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ review.userId }}</td>
            <td>{{ review.mealId }}</td>
            <td>{{ review.rating }}</td>
            <td>{{ review.comments || 'No Comments' }}</td>
            <td>
              <button class="btn btn-danger btn-sm" (click)="deleteReview(review.reviewId)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <ng-template #noReviews>
      <div class="alert alert-warning text-center mt-4">
        No reviews found in the system.
      </div>
    </ng-template>
  </div>
