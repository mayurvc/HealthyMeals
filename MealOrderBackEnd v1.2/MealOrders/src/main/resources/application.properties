spring.application.name=mealorders
spring.datasource.url=jdbc:mysql://localhost:3306/healthy_meals_db
spring.datasource.username=root
spring.datasource.password=kris
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8100/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# Enable Eureka Discovery
spring.cloud.discovery.enabled=true
spring.cloud.compatibility-verifier.enabled=false

server.port=8081
