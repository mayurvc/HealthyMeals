# Application Name
spring.application.name=authentication

# DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/healthy_meals_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.autoconfigure.web=DEBUG
logging.level.root=INFO
logging.level.org,springframework.cloud.gateway.route.RouteDefinitionLocator = INFO

# # Eureka Client Configuration
# eureka.client.service-url.defaultZone=http://localhost:8100/eureka/
# eureka.client.register-with-eureka=true
# eureka.client.fetch-registry=true

# Enable Eureka Discovery
spring.cloud.discovery.enabled=true

# Server Configuration
server.port=8080
